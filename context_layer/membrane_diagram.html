<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Your Context Is Your Membrane — PoC Mapping</title>
<style>
  body { margin: 0; background: #fafafa; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; }
  .container { position: relative; width: 1100px; height: 1100px; }
  svg { width: 100%; height: 100%; }
  @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
  @keyframes dash { to { stroke-dashoffset: -20; } }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  .dash-anim { animation: dash 1.5s linear infinite; }
</style>
</head>
<body>
<div class="container">
<svg viewBox="0 0 1100 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-solid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#047857"/>
    </marker>
  </defs>

  <!-- Background glow -->
  <circle cx="550" cy="520" r="280" fill="url(#core-glow)"/>

  <!-- ═══ MEMBRANE RING (outer) ═══ -->
  <circle cx="550" cy="520" r="300" fill="none" stroke="#7c3aed" stroke-width="3" opacity="0.3"/>
  <circle cx="550" cy="520" r="340" fill="none" stroke="#7c3aed" stroke-width="3" opacity="0.3"/>

  <!-- Membrane segments with our PoC labels -->
  <!-- Top: ONTOLOGY -->
  <path d="M 550 180 A 340 340 0 0 1 835 295" fill="none" stroke="#7c3aed" stroke-width="40" opacity="0.08"/>
  <text x="680" y="215" text-anchor="middle" font-size="16" font-weight="800" fill="#7c3aed" letter-spacing="3" transform="rotate(25,680,215)">ONTOLOGY</text>
  <text x="700" y="235" text-anchor="middle" font-size="10" fill="#6d28d9" transform="rotate(25,700,235)">Drug → Patient → ClinicalTrial</text>

  <!-- Right: IDENTIFIERS -->
  <path d="M 835 295 A 340 340 0 0 1 870 610" fill="none" stroke="#7c3aed" stroke-width="40" opacity="0.08"/>
  <text x="885" y="440" text-anchor="start" font-size="16" font-weight="800" fill="#7c3aed" letter-spacing="3" transform="rotate(72,885,440)">IDENTIFIERS</text>
  <text x="855" y="490" text-anchor="start" font-size="10" fill="#6d28d9" transform="rotate(72,855,490)">Entity Linking @ 0.72</text>

  <!-- Bottom-right: RULES -->
  <path d="M 870 610 A 340 340 0 0 1 640 845" fill="none" stroke="#7c3aed" stroke-width="40" opacity="0.08"/>
  <text x="795" y="755" text-anchor="middle" font-size="16" font-weight="800" fill="#7c3aed" letter-spacing="3" transform="rotate(135,795,755)">RULES</text>
  <text x="760" y="780" text-anchor="middle" font-size="10" fill="#6d28d9" transform="rotate(135,760,780)">Governance + Deterministic</text>

  <!-- Bottom-left: MEANING -->
  <path d="M 640 845 A 340 340 0 0 1 275 720" fill="none" stroke="#7c3aed" stroke-width="40" opacity="0.08"/>
  <text x="420" y="830" text-anchor="middle" font-size="16" font-weight="800" fill="#7c3aed" letter-spacing="3" transform="rotate(-150,420,830)">MEANING</text>
  <text x="445" y="810" text-anchor="middle" font-size="10" fill="#6d28d9" transform="rotate(-150,445,810)">Qdrant 1024-dim Embeddings</text>

  <!-- Left: PROCESSES -->
  <path d="M 275 720 A 340 340 0 0 1 240 390" fill="none" stroke="#7c3aed" stroke-width="40" opacity="0.08"/>
  <text x="220" y="565" text-anchor="end" font-size="16" font-weight="800" fill="#7c3aed" letter-spacing="3" transform="rotate(-72,220,565)">PROCESSES</text>
  <text x="245" y="545" text-anchor="end" font-size="10" fill="#6d28d9" transform="rotate(-72,245,545)">Eval Pipeline + Context Layer</text>

  <!-- Top-left closing -->
  <path d="M 240 390 A 340 340 0 0 1 550 180" fill="none" stroke="#7c3aed" stroke-width="40" opacity="0.08"/>

  <!-- ═══ INNER KNOWLEDGE GRAPH ═══ -->
  <!-- Core node -->
  <circle cx="550" cy="520" r="30" fill="url(#core-solid)" filter="url(#glow)"/>
  <text x="550" y="525" text-anchor="middle" font-size="9" font-weight="700" fill="white">NEO4J</text>

  <!-- Graph nodes (representing our 886 nodes) -->
  <!-- Pharma KG nodes -->
  <circle cx="480" cy="430" r="12" fill="#a78bfa" opacity="0.7"/><text x="480" y="418" text-anchor="middle" font-size="8" fill="#6d28d9">Drug</text>
  <circle cx="620" cy="430" r="12" fill="#a78bfa" opacity="0.7"/><text x="620" y="418" text-anchor="middle" font-size="8" fill="#6d28d9">Patient</text>
  <circle cx="650" cy="550" r="12" fill="#a78bfa" opacity="0.7"/><text x="665" y="545" text-anchor="start" font-size="8" fill="#6d28d9">Trial</text>
  <circle cx="450" cy="570" r="12" fill="#a78bfa" opacity="0.7"/><text x="433" y="565" text-anchor="end" font-size="8" fill="#6d28d9">Ctx_Event</text>
  <circle cx="550" cy="630" r="12" fill="#a78bfa" opacity="0.7"/><text x="550" y="652" text-anchor="middle" font-size="8" fill="#6d28d9">Ctx_Rule</text>
  <circle cx="500" cy="470" r="8" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="600" cy="480" r="8" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="520" cy="580" r="8" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="580" cy="600" r="8" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="470" cy="510" r="8" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="630" cy="510" r="8" fill="#c4b5fd" opacity="0.5"/>

  <!-- Eval nodes (red-tinted) -->
  <circle cx="550" cy="400" r="10" fill="#fca5a5" opacity="0.8"/><text x="550" y="388" text-anchor="middle" font-size="8" fill="#dc2626" font-weight="600">Eval_Proof</text>
  <circle cx="510" cy="380" r="6" fill="#fca5a5" opacity="0.6"/>
  <circle cx="590" cy="385" r="6" fill="#fca5a5" opacity="0.6"/>

  <!-- Graph edges -->
  <line x1="550" y1="520" x2="480" y2="430" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4"/>
  <line x1="550" y1="520" x2="620" y2="430" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4"/>
  <line x1="550" y1="520" x2="650" y2="550" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4"/>
  <line x1="550" y1="520" x2="450" y2="570" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4"/>
  <line x1="550" y1="520" x2="550" y2="630" stroke="#c4b5fd" stroke-width="1.5" opacity="0.4"/>
  <line x1="480" y1="430" x2="620" y2="430" stroke="#c4b5fd" stroke-width="1" opacity="0.3"/>
  <line x1="620" y1="430" x2="650" y2="550" stroke="#c4b5fd" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="570" x2="550" y2="630" stroke="#c4b5fd" stroke-width="1" opacity="0.3"/>
  <line x1="550" y1="520" x2="550" y2="400" stroke="#fca5a5" stroke-width="1.5" opacity="0.5"/>
  <line x1="550" y1="400" x2="450" y2="570" stroke="#fca5a5" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="480" y1="430" x2="500" y2="470" stroke="#c4b5fd" stroke-width="1" opacity="0.3"/>
  <line x1="620" y1="430" x2="600" y2="480" stroke="#c4b5fd" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="570" x2="520" y2="580" stroke="#c4b5fd" stroke-width="1" opacity="0.3"/>
  <line x1="650" y1="550" x2="630" y2="510" stroke="#c4b5fd" stroke-width="1" opacity="0.3"/>

  <!-- Node count label -->
  <text x="550" y="680" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">886 nodes · 38 eval · 848 KG+context</text>

  <!-- ═══ EXTERNAL FORCES ═══ -->

  <!-- Top: LLM JUDGE (the threat that breaches) -->
  <g transform="translate(550, 60)">
    <rect x="-75" y="-25" width="150" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-size="13" font-weight="800" fill="#dc2626">LLM JUDGE</text>
    <text x="0" y="12" text-anchor="middle" font-size="9" fill="#dc2626">Bedrock Haiku · 20% blind</text>
  </g>
  <!-- Arrow from LLM Judge to membrane (breaching) -->
  <line x1="550" y1="95" x2="550" y2="185" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)" class="dash-anim"/>
  <text x="570" y="145" font-size="9" fill="#dc2626" font-weight="600">BREACHES 20%</text>

  <!-- Top-right: MARKET / Users -->
  <g transform="translate(890, 130)">
    <rect x="-55" y="-20" width="110" height="40" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
    <text x="0" y="-2" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">USERS</text>
    <text x="0" y="12" text-anchor="middle" font-size="8" fill="#047857">Queries + Feedback</text>
  </g>
  <line x1="845" y1="155" x2="770" y2="260" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Right: BEDROCK (external model) -->
  <g transform="translate(980, 460)">
    <rect x="-65" y="-25" width="130" height="50" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
    <text x="0" y="-5" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">BEDROCK LLM</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#b45309">Claude · Titan Embed</text>
  </g>
  <line x1="920" y1="465" x2="830" y2="490" stroke="#b45309" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="870" y="468" font-size="8" fill="#b45309">commodity</text>

  <!-- Bottom-right: REGULATION -->
  <g transform="translate(900, 770)">
    <rect x="-55" y="-20" width="110" height="40" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="1.5"/>
    <text x="0" y="-2" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">REGULATION</text>
    <text x="0" y="12" text-anchor="middle" font-size="8" fill="#047857">Clinical Advice Guard</text>
  </g>
  <line x1="855" y1="758" x2="760" y2="700" stroke="#047857" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>

  <!-- Bottom: QDRANT (semantic layer) -->
  <g transform="translate(550, 920)">
    <rect x="-80" y="-25" width="160" height="50" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-size="12" font-weight="700" fill="#0e7490">QDRANT VECTORS</text>
    <text x="0" y="12" text-anchor="middle" font-size="8" fill="#0e7490">4 collections · 663 points · 1024-dim</text>
  </g>
  <line x1="550" y1="895" x2="550" y2="810" stroke="#0e7490" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="570" y="860" font-size="8" fill="#0e7490">semantic grounding</text>

  <!-- Bottom-left: EXCEPTIONS -->
  <g transform="translate(200, 800)">
    <rect x="-55" y="-20" width="110" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="0" y="-2" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">FALSE PASSES</text>
    <text x="0" y="12" text-anchor="middle" font-size="8" fill="#dc2626">Subtle errors that slip</text>
  </g>
  <line x1="250" y1="783" x2="370" y2="700" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-red)" class="dash-anim"/>

  <!-- Left: DETERMINISTIC (the defense) -->
  <g transform="translate(100, 480)">
    <rect x="-70" y="-25" width="140" height="50" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">DETERMINISTIC</text>
    <text x="0" y="12" text-anchor="middle" font-size="8" fill="#047857">Regex · Exact · Code Exec</text>
  </g>
  <line x1="170" y1="470" x2="265" y2="485" stroke="#047857" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="190" y="458" font-size="9" fill="#047857" font-weight="700">100% accurate</text>

  <!-- Top-left: CHANGE -->
  <g transform="translate(180, 180)">
    <rect x="-55" y="-20" width="110" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="0" y="-2" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">EVAL PIPELINE</text>
    <text x="0" y="12" text-anchor="middle" font-size="8" fill="#64748b">4-phase · 12 test cases</text>
  </g>
  <line x1="235" y1="205" x2="350" y2="320" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- ═══ PROOF CALLOUT ═══ -->
  <g transform="translate(550, 1020)">
    <rect x="-250" y="-22" width="500" height="44" rx="6" fill="#7c3aed" opacity="0.95"/>
    <text x="0" y="5" text-anchor="middle" font-size="18" font-weight="800" fill="white" letter-spacing="2">YOUR CONTEXT IS YOUR MEMBRANE</text>
  </g>

  <!-- Subtitle -->
  <text x="550" y="1078" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">
    The boundary between what you build (context) and what you buy (models) is what defines you as a system
  </text>

  <!-- ═══ LEGEND ═══ -->
  <g transform="translate(30, 950)">
    <rect x="0" y="0" width="200" height="110" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="18" font-size="10" font-weight="700" fill="#475569">LEGEND</text>
    <circle cx="20" cy="35" r="5" fill="#047857"/><text x="32" y="39" font-size="9" fill="#475569">Yours — built, not bought</text>
    <circle cx="20" cy="55" r="5" fill="#b45309"/><text x="32" y="59" font-size="9" fill="#475569">Commodity — buyable, replaceable</text>
    <circle cx="20" cy="75" r="5" fill="#dc2626"/><text x="32" y="79" font-size="9" fill="#475569">Threat — breaches the membrane</text>
    <circle cx="20" cy="95" r="5" fill="#7c3aed"/><text x="32" y="99" font-size="9" fill="#475569">The membrane — your context layer</text>
  </g>

  <!-- ═══ STATS BOX ═══ -->
  <g transform="translate(870, 950)">
    <rect x="0" y="0" width="200" height="110" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="12" y="18" font-size="10" font-weight="700" fill="#475569">PoC STATS</text>
    <text x="12" y="38" font-size="9" fill="#7c3aed">Neo4j: 886 nodes · Eval_ prefix</text>
    <text x="12" y="54" font-size="9" fill="#0e7490">Qdrant: 4 collections · 663 pts</text>
    <text x="12" y="70" font-size="9" fill="#b45309">Bedrock: Haiku judge + Titan embed</text>
    <text x="12" y="86" font-size="9" fill="#dc2626">False pass rate: 20%</text>
    <text x="12" y="102" font-size="9" fill="#047857">Deterministic: 100% accurate</text>
  </g>

</svg>
</div>
</body>
</html>
