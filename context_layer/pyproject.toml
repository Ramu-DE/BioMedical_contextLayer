[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-layer"
version = "0.1.0"
description = "Biomedical context layer on Neo4j + OpenSearch: ontology-grounded knowledge, runtime context, and governed neurosymbolic reasoning"
requires-python = ">=3.11"

dependencies = [
    # Graph
    "neo4j>=5.28.0,<6",
    # Vector + hybrid retrieval
    "opensearch-py>=2.8.0,<3",
    # Embeddings and LLM on Bedrock
    "boto3>=1.35.0,<2",
    # Ontology and validation
    "rdflib>=7.1.0,<8",
    "pyshacl>=0.26.0,<0.30",
    # Rule packs
    "PyYAML>=6.0.2,<7",
    # Contracts
    "pydantic>=2.9.0,<3",
]

[project.optional-dependencies]
agent = [
    "langgraph>=1.2.11,<2",
    "langchain-aws>=1.7.3,<2",
]
awsv4 = [
    "requests-aws4auth>=1.3.1,<2",
]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-cov>=5.0.0,<6",
    "hypothesis>=6.112.0,<7",
    "ruff>=0.7.0,<0.13",
    "mypy>=1.13.0,<2",
]

[project.scripts]
ctxlayer = "context_layer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "integration: requires live credentials; skipped without them",
    "opensearch: requires VECTOR_BACKEND=opensearch; skipped otherwise",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101: asserts are the point in tests
per-file-ignores = { "tests/*" = ["S101"] }

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "config.py"]
